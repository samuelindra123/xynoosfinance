name: Release XynoosFinance APK (Manual & Tag)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag rilis (kosongkan untuk otomatis v2.0.<run_number>)"
        required: false
        default: ""
      mandatory_update:
        description: "Wajibkan semua pengguna update ke versi ini (Popup Wajib Update)"
        type: boolean
        required: false
        default: false
      release_channel:
        description: "Jenis paket APK yang dibangun"
        type: choice
        required: false
        default: "release-and-debug"
        options:
          - release-and-debug
          - release-only
          - debug-only
      publish_github_release:
        description: "Terbitkan otomatis ke halaman GitHub Releases"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: xynoos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release-apk:
    name: Build & Release XynoosFinance APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Pre-accept Android SDK Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Keystores for Debug & Release Signing
        shell: bash
        run: |
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -importkeystore \
              -srckeystore debug.keystore \
              -srcstorepass android \
              -srckeypass android \
              -srcalias androiddebugkey \
              -destkeystore my-upload-key.jks \
              -deststoretype PKCS12 \
              -deststorepass android \
              -destkeypass android \
              -destalias upload \
              -noprompt
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Ensure .env Exists for Secrets Plugin
        shell: bash
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Determine Release Tag, Version Code & Gradle Tasks
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_CHANNEL: ${{ inputs.release_channel }}
          INPUT_MANDATORY: ${{ inputs.mandatory_update }}
        run: |
          CHANNEL="${INPUT_CHANNEL:-release-and-debug}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="v2.0.${GITHUB_RUN_NUMBER}"
          fi

          VERSION_NAME="${TAG_NAME#v}"
          VERSION_NAME="${VERSION_NAME#V}"
          VERSION_CODE=$((2 + GITHUB_RUN_NUMBER))

          if [ "$INPUT_MANDATORY" = "true" ]; then
            IS_MANDATORY="true"
            MIN_VERSION_CODE="$VERSION_CODE"
          else
            IS_MANDATORY="false"
            MIN_VERSION_CODE="0"
          fi

          if [ "$CHANNEL" = "release-only" ]; then
            GRADLE_TASKS="assembleRelease"
          elif [ "$CHANNEL" = "debug-only" ]; then
            GRADLE_TASKS="assembleDebug"
          else
            GRADLE_TASKS="assembleRelease assembleDebug"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "min_version_code=${MIN_VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "is_mandatory=${IS_MANDATORY}" >> $GITHUB_OUTPUT
          echo "gradle_tasks=${GRADLE_TASKS}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

      - name: Build APK (${{ steps.meta.outputs.channel }})
        shell: bash
        run: |
          gradle ${{ steps.meta.outputs.gradle_tasks }} \
            -PxynoosVersionCode=${{ steps.meta.outputs.version_code }} \
            -PxynoosVersionName="${{ steps.meta.outputs.version_name }}" \
            -PxynoosGithubRepo="${{ github.repository }}" \
            --no-daemon --stacktrace
          mkdir -p dist
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/XynoosFinance-${{ steps.meta.outputs.tag_name }}-Release.apk"
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/XynoosFinance-${{ steps.meta.outputs.tag_name }}-Debug.apk"
          fi
          ls -lh dist/

      - name: Upload APK Artifacts (Selalu Tersedia di Tab Actions)
        uses: actions/upload-artifact@v4
        with:
          name: XynoosFinance-${{ steps.meta.outputs.tag_name }}-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        id: gh_release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_github_release == true || inputs.publish_github_release == 'true' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "XynoosFinance ${{ steps.meta.outputs.tag_name }} — Official Android APK (Xynoos Technology)"
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            ## XynoosFinance Android Platform (${{ steps.meta.outputs.tag_name }})
            **Dikembangkan dan Dirilis oleh Xynoos Technology**
            - **Versi:** `${{ steps.meta.outputs.version_name }}` (Build `${{ steps.meta.outputs.version_code }}`)
            - **Wajib Update:** `${{ steps.meta.outputs.is_mandatory }}`

            ### Unduh File Instalasi Android (APK)
            - **`XynoosFinance-${{ steps.meta.outputs.tag_name }}-Release.apk`** *(Direkomendasikan untuk distribusi publik & update langsung)*

            <!-- XYNOOS_META:versionCode=${{ steps.meta.outputs.version_code }};minVersionCode=${{ steps.meta.outputs.min_version_code }};mandatory=${{ steps.meta.outputs.is_mandatory }} -->
          files: dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Workflow Summary
        shell: bash
        run: |
          {
            echo "## Build & Release XynoosFinance Selesai"
            echo "- **Tag Rilis:** \`${{ steps.meta.outputs.tag_name }}\` (Build \`${{ steps.meta.outputs.version_code }}\`)"
            echo "- **Wajib Update:** \`${{ steps.meta.outputs.is_mandatory }}\`"
          } >> $GITHUB_STEP_SUMMARY
